name: Deploy FrameVerse-Backend to GKE

on:
  release:
    types: [published]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

env:
  PROJECT_ID: swift-delight-441118-c4
  GKE_CLUSTER: frameverse-cluster
  GKE_ZONE: asia-south1-a
  GAR_LOCATION: asia-south1
  REPOSITORY: cloud-run-source-deploy
  IMAGE: frameverse-backend

jobs:
  deploy:
    name: Build & Deploy Backend to GKE
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}"
          LATEST_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest"
          
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"

      - name: Connect to GKE Cluster
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Deploy to GKE
        env:
          GCP_KEY_JSON: ${{ secrets.GCP_SA_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI || 'mongodb://frameverse:qwr%40123.764@mongo.default.svc.cluster.local:27017/?authSource=admin' }}
        run: |
          # 1. Update or create the backend configuration secrets
          # Use printf with environment variable to preserve quotes and raw JSON formatting
          printf '%s' "$GCP_KEY_JSON" > /tmp/key.json
          kubectl create secret generic frameverse-backend-secret \
            --from-literal=mongo-uri="${MONGO_URI}" \
            --from-literal=gcp-project-id="${{ secrets.GCP_PROJECT_ID || env.PROJECT_ID }}" \
            --from-literal=gcs-bucket-name="${{ secrets.GCS_BUCKET_NAME || 'frameverse-videos-gfh' }}" \
            --from-file=key.json=/tmp/key.json \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f /tmp/key.json

          # 2. Apply deployment and service manifests
          kubectl apply -f k8s/deployment.yaml

          # 3. Update deployment with newly built image tag
          IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}"
          kubectl set image deployment/frameverse-backend backend="$IMAGE_TAG"

          # 4. Wait for rollout to complete
          kubectl rollout status deployment/frameverse-backend --timeout=180s

          echo "=========================================================="
          echo "FrameVerse-Backend successfully deployed to GKE cluster!"
          echo "Internal Service: frameverse-backend.default.svc.cluster.local:8080"
          echo "Health Check:     http://frameverse-backend:8080/healthz"
          echo "=========================================================="
